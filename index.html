<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121a2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>重訓紀錄</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0f19;
        --card: #121a2a;
        --text: #e8eefc;
        --muted: #a9b6d6;
        --border: rgba(255, 255, 255, 0.12);
        --accent: #6ea8fe;
        --danger: #ff6b6b;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --card: #ffffff;
          --text: #101828;
          --muted: #475467;
          --border: rgba(16, 24, 40, 0.12);
          --accent: #2563eb;
          --danger: #dc2626;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, rgba(110, 168, 254, 0.18), transparent 60%),
          radial-gradient(900px 500px at 90% 20%, rgba(255, 107, 107, 0.12), transparent 55%),
          var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 16px 56px;
      }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 40;
        margin: -28px -16px 16px;
        padding: 18px 16px 14px;
        background: color-mix(in oklab, var(--bg) 88%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      .app-header-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .app-header h1 {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .app-header h1 .fa-dumbbell {
        color: color-mix(in oklab, var(--accent), white 6%);
        font-size: 0.95em;
        opacity: 0.95;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: 0.2px;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }
      .card {
        background: color-mix(in oklab, var(--card), transparent 0%);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      }
      form.log-form {
        display: grid;
        grid-template-columns: minmax(220px, 1.6fr) minmax(200px, 1fr) minmax(200px, 1fr) minmax(200px, 1fr) auto;
        gap: 12px;
        align-items: end;
      }
      .log-form-field--actions {
        align-self: end;
      }
      @media (max-width: 720px) {
        form.log-form {
          grid-template-columns: 1fr;
          /* 動作名稱後立刻是操作列，避免 datalist 下拉蓋過遠下方的儲存鈕 */
          row-gap: 10px;
        }
        form.log-form .log-form-field--exercise {
          order: 1;
        }
        form.log-form .log-form-field--actions {
          order: 2;
          position: sticky;
          bottom: max(12px, env(safe-area-inset-bottom));
          z-index: 6;
          padding-top: 4px;
          margin-top: 2px;
          margin-bottom: 4px;
          background: linear-gradient(
            to bottom,
            color-mix(in oklab, var(--card), transparent 22%) 0%,
            var(--card) 24%
          );
          box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.12);
          border-radius: 12px;
        }
        form.log-form .log-form-field--weight {
          order: 3;
        }
        form.log-form .log-form-field--reps {
          order: 4;
        }
        form.log-form .log-form-field--sets {
          order: 5;
        }
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        min-width: 0;
        overflow: hidden; /* 防止 1RM/長字串溢出蓋到相鄰欄位 */
      }
      .label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
        white-space: nowrap;
      }
      .label-row .label-text {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .unit-toggle {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 10px;
        height: 30px;
        border-radius: 999px;
        font-size: 12px;
      }
      .btn-inline-ico {
        font-size: 1.05em;
        line-height: 1;
      }
      .btn-with-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-with-icon .btn-ico {
        font-size: 1.15em;
        line-height: 1;
      }
      .btn-icon-only {
        min-width: 44px;
        padding-left: 10px;
        padding-right: 10px;
      }
      .field {
        display: grid;
        gap: 8px;
        min-width: 0;
        width: 100%;
        overflow: hidden; /* 將 rm 區塊控制在同一欄位內 */
      }
      .stepper {
        display: grid;
        grid-template-columns: auto minmax(96px, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .stepper button {
        min-width: 44px;
        height: 42px;
        padding: 0 12px;
      }
      .stepper input {
        min-width: 96px;
        width: 100%;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background-color: color-mix(in oklab, var(--card), black 6%);
        color: var(--text) !important;
        -webkit-text-fill-color: var(--text);
        caret-color: var(--text);
        font-size: 14px;
        font-weight: 700;
        outline: none;
        appearance: none;
      }
      input:focus {
        border-color: color-mix(in oklab, var(--accent), white 10%);
        box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 78%);
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 11px 14px;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      button:active {
        transform: translateY(0.5px);
      }
      .primary {
        background: var(--accent);
        color: white;
      }
      .ghost {
        background: color-mix(in oklab, var(--card), black 8%);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .danger {
        background: transparent;
        border: 1px solid color-mix(in oklab, var(--danger), transparent 30%);
        color: var(--danger);
      }
      .primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
        margin-bottom: 10px;
      }
      .section-title h2 {
        margin: 0;
        font-size: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        background: color-mix(in oklab, var(--card), black 4%);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .table-toolbar {
        margin-bottom: 10px;
      }
      .table-toolbar input[type="search"] {
        max-width: min(420px, 100%);
        font-weight: 600;
      }
      .table-toolbar input[type="search"]::placeholder {
        font-weight: 500;
        color: color-mix(in oklab, var(--muted), transparent 22%);
      }
      .rm-cell {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .pr-trophy {
        font-size: 1.15em;
        line-height: 1;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));
      }
      .pr-toast {
        position: fixed;
        z-index: 50;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(calc(100% + 32px));
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-radius: 999px;
        border: 1px solid color-mix(in oklab, var(--accent), transparent 55%);
        background: color-mix(in oklab, var(--card), black 8%);
        color: var(--text);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
        opacity: 0;
        pointer-events: none;
        transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
      }
      .pr-toast.pr-toast--visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
      .pr-toast-icon {
        font-size: 20px;
        line-height: 1;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 10px 2px 0;
      }
      .empty-state {
        margin-top: 8px;
      }
      .empty-state-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
        padding: 28px 20px 32px;
        border-radius: 16px;
        border: 1px dashed color-mix(in oklab, var(--accent), transparent 55%);
        background: radial-gradient(
            120% 80% at 50% 0%,
            color-mix(in oklab, var(--accent), transparent 88%),
            color-mix(in oklab, var(--card), black 5%) 45%
          ),
          color-mix(in oklab, var(--card), black 4%);
        box-shadow: inset 0 1px 0 color-mix(in oklab, white, transparent 92%);
      }
      .empty-state-card .empty-state-fa {
        font-size: 2rem;
        color: color-mix(in oklab, var(--accent), white 4%);
        opacity: 0.9;
      }
      .empty-state-msg {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        line-height: 1.55;
        color: var(--text);
        max-width: 22rem;
      }
      .empty-state-sub {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        max-width: 20rem;
        line-height: 1.45;
      }
      .empty-state .empty-muted {
        text-align: center;
        margin: 14px 0 6px;
        padding: 12px;
      }
      .pwa-hint {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin: 12px -16px 0;
        padding: 12px 16px;
        border-radius: 0 0 14px 14px;
        border: 1px solid color-mix(in oklab, var(--accent), transparent 65%);
        border-top: 0;
        background: color-mix(in oklab, var(--accent), transparent 90%);
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
      }
      .pwa-hint > .fa-mobile-screen-button {
        flex: 0 0 auto;
        margin-top: 2px;
        font-size: 1.25rem;
        color: color-mix(in oklab, var(--accent), white 2%);
      }
      .pwa-hint-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .pwa-hint-text strong {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        letter-spacing: 0.2px;
      }
      .pwa-hint-close {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 10px;
        background: color-mix(in oklab, var(--card), black 6%);
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        line-height: 1;
      }
      .pwa-hint-close:hover {
        color: var(--text);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        background: color-mix(in oklab, var(--card), black 4%);
        user-select: none;
      }
      .pill strong {
        color: var(--text);
        font-weight: 700;
      }
      .rm {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: color-mix(in oklab, var(--card), black 6%);
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        overflow: hidden; /* 防止 1RM 長度撐出到相鄰欄位 */
      }
      .rm .label {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        flex: 0 0 auto;
        min-width: 0;
      }
      .rm .value {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.2px;
        color: color-mix(in oklab, var(--accent), white 10%);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1 1 auto;
        min-width: 0;
      }

      .table-link {
        background: transparent;
        border: 0;
        padding: 0;
        color: color-mix(in oklab, var(--accent), white 8%);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .table-link:hover {
        color: color-mix(in oklab, var(--accent), white 16%);
      }
      .chart-wrap {
        margin-top: 0;
      }
      .chart-area {
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: color-mix(in oklab, var(--card), black 4%);
        position: relative;
        height: 360px;
      }
      .chart-meta {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 8px 0;
      }
      #progressChart {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      .analysis-card {
        margin-bottom: 12px;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: color-mix(in oklab, var(--card), black 4%);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
      }
      .analysis-growth {
        font-size: 15px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.2px;
        color: var(--accent);
        margin: 0 0 8px 0;
      }
      .analysis-growth:empty {
        display: none;
        margin: 0;
      }
      .analysis-coach {
        font-size: 14px;
        line-height: 1.55;
        color: var(--accent);
        margin: 0;
      }

      .pr-wall {
        margin-top: 14px;
      }
      .pr-wall-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 14px 0 10px;
      }
      .pr-wall-title h2 {
        margin: 0;
        font-size: 16px;
      }
      .pr-wall-scroller {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 2px 2px 10px;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }
      .pr-wall-scroller::-webkit-scrollbar {
        height: 8px;
      }
      .pr-wall-scroller::-webkit-scrollbar-thumb {
        background: color-mix(in oklab, var(--border), transparent 20%);
        border-radius: 999px;
      }
      .pr-card {
        flex: 0 0 auto;
        width: 220px;
        scroll-snap-align: start;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: color-mix(in oklab, var(--card), black 4%);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
        padding: 14px 14px 12px;
      }
      .pr-card-name {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 850;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pr-card-value {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.3px;
        font-variant-numeric: tabular-nums;
        color: #f5c542;
        text-shadow: 0 8px 24px rgba(245, 197, 66, 0.12);
      }
      .pr-card-date {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .confetti-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 80;
        overflow: hidden;
      }
      .confetti {
        position: absolute;
        top: -12px;
        width: 8px;
        height: 12px;
        border-radius: 3px;
        opacity: 0.95;
        animation: confetti-fall 1100ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
      }
      @keyframes confetti-fall {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        100% {
          transform: translate3d(var(--dx), 110vh, 0) rotate(520deg);
          opacity: 0;
        }
      }

      .log-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 980px) {
        .log-layout {
          grid-template-columns: 1fr;
        }
        .chart-wrap {
          margin-top: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="app-header">
        <div class="app-header-row">
          <div>
            <h1>
              <i class="fa-solid fa-dumbbell" aria-hidden="true"></i>
              重訓紀錄
            </h1>
            <p class="hint">輸入動作、重量與次數/組數，按「儲存紀錄」即可加入清單。</p>
          </div>
          <div class="pill" id="summaryPill" aria-live="polite"></div>
        </div>
        <div id="pwaHint" class="pwa-hint" hidden>
          <i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i>
          <div class="pwa-hint-text">
            <strong><i class="fa-solid fa-house-chimney fa-fw" aria-hidden="true"></i> 加入主螢幕</strong>
            將本頁加入主畫面，開啟時更像手機 App。Safari：點「分享」→「加入主畫面」；Chrome：選單中的「安裝應用程式」或「加到主畫面」。
          </div>
          <button type="button" class="pwa-hint-close" id="pwaHintClose" aria-label="關閉加入主螢幕提示">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div class="card">
        <form id="logForm" class="log-form">
          <label class="log-form-field--exercise">
            重訓動作名稱
            <input
              id="exerciseName"
              name="exerciseName"
              list="exerciseNameList"
              autocomplete="off"
              placeholder="例如：臥推 Bench Press"
              required
            />
          </label>
          <label class="log-form-field--weight">
            <div class="label-row">
              <span class="label-text">重量 (<span id="weightUnitLabel">lb</span>)</span>
              <button class="ghost unit-toggle" type="button" id="weightUnitBtn" aria-label="切換重量單位">
                <span class="btn-inline-ico" aria-hidden="true">🔄</span>lb
              </button>
            </div>
            <div class="field">
              <div class="stepper">
                <button class="ghost" type="button" id="weightMinusBtn" aria-label="重量減 5">-5</button>
                <input id="weight" name="weight" inputmode="decimal" type="text" placeholder="例如：135" required />
                <button class="ghost" type="button" id="weightPlusBtn" aria-label="重量加 5">+5</button>
              </div>
            </div>
          </label>
          <label class="log-form-field--reps">
            次數
            <div class="field">
              <div class="stepper">
                <button class="ghost" type="button" id="repsMinusBtn" aria-label="次數減 1">-1</button>
                <input id="reps" name="reps" inputmode="numeric" type="number" min="1" step="1" placeholder="例如：8" required />
                <button class="ghost" type="button" id="repsPlusBtn" aria-label="次數加 1">+1</button>
              </div>
              <div class="rm" id="rmBox" aria-live="polite">
                <div class="label">預估 1RM</div>
                <div class="value" id="rmValue">—</div>
              </div>
            </div>
          </label>
          <label class="log-form-field--sets">
            組數
            <div class="field">
              <div class="stepper">
                <button class="ghost" type="button" id="setsMinusBtn" aria-label="組數減 1">-1</button>
                <input id="sets" name="sets" inputmode="numeric" type="number" min="1" step="1" placeholder="例如：3" required />
                <button class="ghost" type="button" id="setsPlusBtn" aria-label="組數加 1">+1</button>
              </div>
            </div>
          </label>
          <div class="actions log-form-field--actions">
            <button class="ghost" type="button" id="clearInputsBtn">清空輸入</button>
            <button class="primary btn-with-icon" type="submit" id="saveBtn">
              <span class="btn-ico" aria-hidden="true">💾</span>儲存紀錄
            </button>
          </div>
        </form>
        <datalist id="exerciseNameList"></datalist>

        <div class="section-title">
          <h2>已儲存的紀錄</h2>
          <button class="danger" type="button" id="clearAllBtn">清除全部</button>
        </div>

        <div class="log-layout">
          <div>
            <div class="table-toolbar" id="tableToolbar" hidden>
              <input
                type="search"
                id="logSearchInput"
                autocomplete="off"
                placeholder="搜尋動作名稱…"
                aria-label="搜尋動作名稱"
              />
            </div>
            <div id="tableWrap"></div>
            <div class="empty-state" id="emptyState" hidden aria-live="polite">
              <div id="emptyStateBody"></div>
            </div>
          </div>

          <div class="chart-wrap" id="chartWrap" hidden>
            <div class="section-title">
              <h2>進度追蹤圖表</h2>
            </div>
            <div class="analysis-card" id="analysisCard" hidden aria-live="polite">
              <p class="analysis-growth" id="analysisGrowth"></p>
              <p class="analysis-coach" id="analysisCoach"></p>
            </div>
            <div class="chart-area">
              <p class="chart-meta" id="chartMeta" aria-live="polite"></p>
              <canvas id="progressChart"></canvas>
            </div>
            <section class="pr-wall" id="prWall" hidden>
              <div class="pr-wall-title">
                <h2>🏆 PR 榮譽牆 (Personal Records)</h2>
              </div>
              <div class="pr-wall-scroller" id="prWallScroller" aria-label="PR 榮譽牆卡片列表"></div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <div id="prToast" class="pr-toast" hidden role="status" aria-live="polite">
      <span class="pr-toast-icon" aria-hidden="true">🎉</span>
      <span>恭喜達成新紀錄！</span>
    </div>
    <div class="confetti-layer" id="confettiLayer" hidden aria-hidden="true"></div>

    <script>
      const STORAGE_KEY = "strength_logs_v1";
      const UNIT_KEY = "strength_unit_preference_v1";
      const PWA_HINT_KEY = "smartlift_pwa_hint_v1";
      const DEFAULT_UNIT = "lb";
      /** 建議清單中視為「最近」的天數區間（優先排在前面） */
      const RECENT_EXERCISE_WINDOW_DAYS = 7;

      /** @type {"lb"|"kg"} */
      let unit = DEFAULT_UNIT;

      /** @type {{id:string, name:string, weightLb:number, reps:number, sets:number, createdAt:string}[]} */
      let logs = [];

      const form = document.getElementById("logForm");
      const exerciseNameEl = document.getElementById("exerciseName");
      const exerciseNameList = document.getElementById("exerciseNameList");
      const weightEl = document.getElementById("weight");
      const repsEl = document.getElementById("reps");
      const setsEl = document.getElementById("sets");
      const tableWrap = document.getElementById("tableWrap");
      const tableToolbar = document.getElementById("tableToolbar");
      const logSearchInput = document.getElementById("logSearchInput");
      const emptyState = document.getElementById("emptyState");
      const emptyStateBody = document.getElementById("emptyStateBody");
      const prWall = document.getElementById("prWall");
      const prWallScroller = document.getElementById("prWallScroller");
      const pwaHint = document.getElementById("pwaHint");
      const pwaHintClose = document.getElementById("pwaHintClose");
      const prToast = document.getElementById("prToast");
      const confettiLayer = document.getElementById("confettiLayer");
      const clearAllBtn = document.getElementById("clearAllBtn");
      const clearInputsBtn = document.getElementById("clearInputsBtn");
      const summaryPill = document.getElementById("summaryPill");
      const rmValue = document.getElementById("rmValue");
      const weightMinusBtn = document.getElementById("weightMinusBtn");
      const weightPlusBtn = document.getElementById("weightPlusBtn");
      const weightUnitBtn = document.getElementById("weightUnitBtn");
      const weightUnitLabel = document.getElementById("weightUnitLabel");
      const repsMinusBtn = document.getElementById("repsMinusBtn");
      const repsPlusBtn = document.getElementById("repsPlusBtn");
      const setsMinusBtn = document.getElementById("setsMinusBtn");
      const setsPlusBtn = document.getElementById("setsPlusBtn");
      const chartWrap = document.getElementById("chartWrap");
      const analysisCard = document.getElementById("analysisCard");
      const analysisGrowth = document.getElementById("analysisGrowth");
      const analysisCoach = document.getElementById("analysisCoach");
      const chartMeta = document.getElementById("chartMeta");
      const progressChartEl = document.getElementById("progressChart");

      /** @type {string|null} */
      let selectedExercise = null;
      /** @type {string} */
      let logSearchQuery = "";
      /** @type {ReturnType<typeof setTimeout>|null} */
      let prToastTimer = null;
      /** @type {import("chart.js").Chart | null} */
      let progressChart = null;

      function lbToKg(lb) {
        return lb * 0.45359237;
      }

      function kgToLb(kg) {
        return kg / 0.45359237;
      }

      function roundToStep(value, step) {
        if (!Number.isFinite(value)) return value;
        if (!Number.isFinite(step) || step <= 0) return value;
        return Math.round(value / step) * step;
      }

      function unitStep() {
        return unit === "kg" ? 0.1 : 0.5;
      }

      function unitDelta() {
        return unit === "kg" ? 2.5 : 5;
      }

      function updateWeightButtonsUI() {
        const d = unitDelta();
        weightMinusBtn.textContent = `-${d}`;
        weightPlusBtn.textContent = `+${d}`;
        weightMinusBtn.setAttribute("aria-label", `重量減 ${d}`);
        weightPlusBtn.setAttribute("aria-label", `重量加 ${d}`);
      }

      function setWeightUnitButtonLabel(nextUnit) {
        const u = nextUnit === "kg" ? "kg" : "lb";
        weightUnitBtn.innerHTML = `<span class="btn-inline-ico" aria-hidden="true">🔄</span>${escapeHtml(u)}`;
      }

      function formatNumber(value, decimals = 1) {
        if (!Number.isFinite(value)) return "—";
        const m = Math.pow(10, decimals);
        return String(Math.round(value * m) / m);
      }

      function setUnit(nextUnit, { convertInput = true } = {}) {
        if (nextUnit !== "lb" && nextUnit !== "kg") nextUnit = DEFAULT_UNIT;
        if (nextUnit === unit) return;

        const current = parseNum(weightEl);
        const hasValue = Number.isFinite(current);
        const prevUnit = unit;
        unit = nextUnit;

        // Update UI
        weightUnitLabel.textContent = unit;
        setWeightUnitButtonLabel(unit);
        weightEl.placeholder = unit === "kg" ? "例如：60" : "例如：135";
        updateWeightButtonsUI();

        if (hasValue && convertInput) {
          const converted = prevUnit === "lb" ? lbToKg(current) : kgToLb(current);
          const stepped = roundToStep(converted, unitStep());
          weightEl.value = String(stepped);
        }

        localStorage.setItem(UNIT_KEY, unit);
        update1RM();
        render();
        if (selectedExercise) updateChart(selectedExercise);
      }

      function loadUnitPreference() {
        const raw = localStorage.getItem(UNIT_KEY);
        if (raw === "lb" || raw === "kg") unit = raw;
        else unit = DEFAULT_UNIT;

        // Apply initial UI without converting (there is no input yet)
        weightUnitLabel.textContent = unit;
        setWeightUnitButtonLabel(unit);
        weightEl.placeholder = unit === "kg" ? "例如：60" : "例如：135";
        updateWeightButtonsUI();
      }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          if (Array.isArray(parsed)) {
            logs = parsed
              .filter((x) => x && typeof x === "object")
              .map((x) => {
                const name = typeof x.name === "string" ? x.name : "";
                const weightLb = Number(x.weightLb);
                const reps = Number(x.reps);
                const sets = Number.isFinite(Number(x.sets)) ? Number(x.sets) : 1;
                return {
                  id: typeof x.id === "string" ? x.id : String(Date.now()) + "_" + Math.random().toString(16).slice(2),
                  name,
                  weightLb: Number.isFinite(weightLb) ? weightLb : 0,
                  reps: Number.isFinite(reps) ? reps : 1,
                  sets: Number.isFinite(sets) ? sets : 1,
                  createdAt: typeof x.createdAt === "string" ? x.createdAt : new Date().toISOString(),
                };
              });
          } else {
            logs = [];
          }
        } catch {
          logs = [];
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
      }

      function fmtDate(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        return d.toLocaleString(undefined, { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
      }

      function renderSummary() {
        const total = logs.length;
        const last = logs[0];
        if (!total) {
          summaryPill.textContent = "總計 0 筆";
          return;
        }

        const lastWeight = last
          ? unit === "lb"
            ? last.weightLb
            : roundToStep(lbToKg(last.weightLb), unitStep())
          : null;

        summaryPill.innerHTML =
          `總計 <strong>${total}</strong> 筆` +
          (last
            ? `｜最新：<strong>${escapeHtml(last.name)}</strong> ${formatNumber(lastWeight, 1)} ${unit} × ${last.reps} × ${last.sets} 組`
            : "");
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      /** 依 logs 動態更新 datalist：最近區間內用過的動作優先，其餘依最後一次使用時間新→舊 */
      function syncExerciseNameDatalist() {
        if (!exerciseNameList) return;

        const now = Date.now();
        const windowMs = RECENT_EXERCISE_WINDOW_DAYS * 86400000;
        const recentCutoff = now - windowMs;

        /** @type {Map<string, number>} name -> latest createdAt timestamp */
        const lastUsed = new Map();
        for (const log of logs) {
          const t = new Date(log.createdAt).getTime();
          if (Number.isNaN(t)) continue;
          const name = typeof log.name === "string" ? log.name.trim() : "";
          if (!name) continue;
          const prev = lastUsed.get(name);
          if (prev === undefined || t > prev) lastUsed.set(name, t);
        }

        const entries = [...lastUsed.entries()].map(([name, ts]) => ({ name, ts }));
        const recent = entries.filter((e) => e.ts >= recentCutoff).sort((a, b) => b.ts - a.ts);
        const older = entries.filter((e) => e.ts < recentCutoff).sort((a, b) => b.ts - a.ts);
        const orderedNames = [...recent, ...older].map((e) => e.name);

        exerciseNameList.innerHTML = "";
        for (const name of orderedNames) {
          const opt = document.createElement("option");
          opt.value = name;
          exerciseNameList.appendChild(opt);
        }
      }

      /** 以儲存的 lb 重量計算預估 1RM（結果為 lb 尺度，不同紀錄間可比較）。 */
      function oneRmLbFromRecord(item) {
        return estimate1RM(item.weightLb, item.reps);
      }

      /** 每個動作名稱目前的歷史最高預估 1RM（lb 尺度）。 */
      function maxOneRmLbByExercise(allLogs) {
        /** @type {Map<string, number>} */
        const map = new Map();
        for (const item of allLogs) {
          const om = oneRmLbFromRecord(item);
          if (!Number.isFinite(om)) continue;
          const prev = map.get(item.name);
          if (prev === undefined || om > prev) map.set(item.name, om);
        }
        return map;
      }

      function filterLogsBySearch(allLogs, query) {
        const q = String(query ?? "").trim().toLowerCase();
        if (!q) return allLogs.slice();
        return allLogs.filter((x) => String(x.name).toLowerCase().includes(q));
      }

      function showPrCelebration() {
        if (!prToast) return;
        prToast.hidden = false;
        if (prToastTimer) clearTimeout(prToastTimer);
        requestAnimationFrame(() => {
          prToast.classList.add("pr-toast--visible");
        });
        prToastTimer = setTimeout(() => {
          prToast.classList.remove("pr-toast--visible");
          setTimeout(() => {
            prToast.hidden = true;
          }, 320);
        }, 4000);
      }

      function spawnConfetti() {
        if (!confettiLayer) return;
        confettiLayer.hidden = false;
        confettiLayer.innerHTML = "";

        const colors = ["#f5c542", "#6ea8fe", "#ff6b6b", "#34d399", "#a78bfa", "#fb7185"];
        const count = 46;
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "confetti";
          const left = Math.random() * 100;
          const dx = (Math.random() * 2 - 1) * 160;
          const delay = Math.random() * 140;
          const size = 6 + Math.random() * 6;
          el.style.left = `${left}vw`;
          el.style.setProperty("--dx", `${dx}px`);
          el.style.animationDelay = `${delay}ms`;
          el.style.width = `${size}px`;
          el.style.height = `${Math.round(size * 1.4)}px`;
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          confettiLayer.appendChild(el);
        }

        setTimeout(() => {
          if (!confettiLayer) return;
          confettiLayer.hidden = true;
          confettiLayer.innerHTML = "";
        }, 1600);
      }

      function getPersonalRecords(allLogs) {
        /** @type {Map<string, {name:string, oneRmLb:number, createdAt:string}>} */
        const best = new Map();
        for (const item of allLogs) {
          const name = typeof item.name === "string" ? item.name.trim() : "";
          if (!name) continue;
          const omLb = estimate1RM(item.weightLb, item.reps);
          if (!Number.isFinite(omLb)) continue;
          const prev = best.get(name);
          if (!prev || omLb > prev.oneRmLb) {
            best.set(name, { name, oneRmLb: omLb, createdAt: item.createdAt });
          }
        }
        return [...best.values()].sort((a, b) => b.oneRmLb - a.oneRmLb);
      }

      function renderPrWall() {
        if (!prWall || !prWallScroller) return;
        if (!logs.length) {
          prWall.hidden = true;
          prWallScroller.innerHTML = "";
          return;
        }
        const prs = getPersonalRecords(logs);
        if (!prs.length) {
          prWall.hidden = true;
          prWallScroller.innerHTML = "";
          return;
        }
        prWall.hidden = false;
        prWallScroller.innerHTML = "";

        for (const pr of prs) {
          const omDisplayRaw = unit === "lb" ? pr.oneRmLb : lbToKg(pr.oneRmLb);
          const omDisplay = unit === "kg" ? roundToStep(omDisplayRaw, unitStep()) : omDisplayRaw;
          const card = document.createElement("div");
          card.className = "pr-card";
          card.innerHTML = `
            <p class="pr-card-name">${escapeHtml(pr.name)}</p>
            <p class="pr-card-value">${formatNumber(omDisplay, 1)} ${escapeHtml(unit)}</p>
            <p class="pr-card-date">達成：${escapeHtml(fmtDate(pr.createdAt))}</p>
          `;
          prWallScroller.appendChild(card);
        }
      }

      function render() {
        tableWrap.innerHTML = "";

        if (!logs.length) {
          if (emptyStateBody) {
            emptyStateBody.innerHTML = `
              <div class="empty-state-card">
                <i class="fa-solid fa-dumbbell empty-state-fa" aria-hidden="true"></i>
                <p class="empty-state-msg">目前還沒有紀錄，開始你的第一次訓練吧！🏋️‍♂️</p>
              </div>`;
          }
          emptyState.hidden = false;
          chartWrap.hidden = true;
          if (tableToolbar) tableToolbar.hidden = true;
          if (logSearchInput) logSearchInput.value = "";
          logSearchQuery = "";
          if (analysisCard) {
            analysisCard.hidden = true;
            if (analysisGrowth) analysisGrowth.textContent = "";
            if (analysisCoach) analysisCoach.textContent = "";
          }
          renderSummary();
          syncExerciseNameDatalist();
          renderPrWall();
          return;
        }

        if (tableToolbar) tableToolbar.hidden = false;

        const visibleLogs = filterLogsBySearch(logs, logSearchQuery);
        const maxOmLbMap = maxOneRmLbByExercise(logs);

        if (!visibleLogs.length) {
          if (emptyStateBody) {
            emptyStateBody.innerHTML = `<p class="empty empty-muted">沒有符合搜尋條件的紀錄。</p>`;
          }
          emptyState.hidden = false;
        } else {
          emptyState.hidden = true;
          if (emptyStateBody) emptyStateBody.innerHTML = "";
        }

        chartWrap.hidden = false;

        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th style="width: 28%;">動作</th>
              <th style="width: 11%;">重量 (${escapeHtml(unit)})</th>
              <th style="width: 9%;">次數</th>
              <th style="width: 9%;">組數</th>
              <th style="width: 13%;">預估 1RM (${escapeHtml(unit)})</th>
              <th style="width: 13%;">總訓練量 (${escapeHtml(unit)})</th>
              <th style="width: 13%;">時間</th>
              <th style="width: 8%;">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector("tbody");

        for (const item of visibleLogs) {
          const displayWeightRaw = unit === "lb" ? item.weightLb : roundToStep(lbToKg(item.weightLb), unitStep());
          const totalVolume = displayWeightRaw * item.reps * item.sets;
          const omLb = oneRmLbFromRecord(item);
          const omDisplayRaw = unit === "lb" ? omLb : lbToKg(omLb);
          const omDisplay = unit === "kg" ? roundToStep(omDisplayRaw, unitStep()) : omDisplayRaw;
          const maxLb = maxOmLbMap.get(item.name);
          const isBest =
            Number.isFinite(omLb) &&
            Number.isFinite(maxLb) &&
            Math.abs(omLb - maxLb) < 1e-5;
          const trophyHtml = isBest ? ` <span class="pr-trophy" title="此動作目前歷史最佳預估 1RM">🏆</span>` : "";

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><button class="table-link" type="button" data-exercise="${escapeHtml(item.name)}">${escapeHtml(item.name)}</button></td>
            <td>${formatNumber(displayWeightRaw, 1)}</td>
            <td>${item.reps}</td>
            <td>${item.sets}</td>
            <td><span class="rm-cell">${formatNumber(omDisplay, 1)} ${escapeHtml(unit)}${trophyHtml}</span></td>
            <td>${formatNumber(totalVolume, 1)}</td>
            <td>${escapeHtml(fmtDate(item.createdAt))}</td>
            <td><button class="ghost btn-icon-only" type="button" data-del="${escapeHtml(
              item.id
            )}" aria-label="刪除此筆紀錄"><span aria-hidden="true">🗑️</span></button></td>
          `;
          tbody.appendChild(tr);
        }

        tableWrap.appendChild(table);
        renderSummary();
        syncExerciseNameDatalist();
        renderPrWall();
      }

      function getAccentColor() {
        const c = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
        return c || "#6ea8fe";
      }

      function isoToDateLabel(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        // X 軸僅顯示月/日，避免資料多時年份擁擠
        return d.toLocaleDateString(undefined, { month: "2-digit", day: "2-digit" });
      }

      function isoToDateKey(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function estimate1RM(weightInUnit, reps) {
        if (!Number.isFinite(weightInUnit) || weightInUnit <= 0) return NaN;
        if (!Number.isFinite(reps) || reps < 1) return NaN;
        return weightInUnit * (1 + reps / 30);
      }

      /** 依時間排序後，首筆與末筆「原始紀錄」的 1RM 成長率（%）；筆數不足或無法計算時回傳 null。 */
      function growthRateFirstLastRecords(items) {
        if (!items || items.length < 2) return null;
        const sorted = items
          .slice()
          .sort((a, b) => new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime());
        const first = sorted[0];
        const last = sorted[sorted.length - 1];
        const w1 = unit === "lb" ? first.weightLb : lbToKg(first.weightLb);
        const w2 = unit === "lb" ? last.weightLb : lbToKg(last.weightLb);
        const rm1 = estimate1RM(w1, first.reps);
        const rm2 = estimate1RM(w2, last.reps);
        if (!Number.isFinite(rm1) || !Number.isFinite(rm2) || rm1 <= 0) return null;
        return ((rm2 - rm1) / rm1) * 100;
      }

      function coachMessageForGrowth(pct) {
        if (pct > 5) {
          return "🔥 表現驚人！你已經達成漸進式超負荷，建議下週挑戰增加 2.5kg/5lb。";
        }
        if (pct >= 0) {
          return "💪 穩定進步中，請保持目前的訓練頻率。";
        }
        return "⚖️ 力量微幅下降，請確認是否訓練過度或休息不足。";
      }

      function updateAnalysisPanel(items) {
        if (!analysisCard || !analysisGrowth || !analysisCoach) return;

        if (!items || !items.length) {
          analysisCard.hidden = true;
          analysisGrowth.textContent = "";
          analysisCoach.textContent = "";
          return;
        }

        analysisCard.hidden = false;

        if (items.length < 2) {
          analysisGrowth.textContent = "";
          analysisCoach.textContent = "需要更多數據來分析你的進步趨勢";
          return;
        }

        const pct = growthRateFirstLastRecords(items);
        if (pct === null) {
          analysisGrowth.textContent = "";
          analysisCoach.textContent = "需要更多數據來分析你的進步趨勢";
          return;
        }

        const sign = pct > 0 ? "+" : "";
        analysisGrowth.textContent = `1RM 成長率（首筆→末筆）：${sign}${formatNumber(pct, 1)}%`;
        analysisCoach.textContent = coachMessageForGrowth(pct);
      }

      function updateChart(exerciseName) {
        const name = String(exerciseName ?? "").trim();
        if (!name) return;

        selectedExercise = name;
        if (!logs.length) return;

        const items = logs
          .filter((x) => x && typeof x === "object" && x.name === name)
          .slice()
          .sort((a, b) => new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime());

        if (!items.length) {
          chartMeta.textContent = `找不到「${name}」的歷史紀錄。`;
          updateAnalysisPanel([]);
          if (progressChart) {
            progressChart.destroy();
            progressChart = null;
          }
          return;
        }

        updateAnalysisPanel(items);

        // 彙整：同一天多筆紀錄只保留「當天最高 1RM」，避免 X 軸過密 & 折線雜訊
        const byDay = new Map();
        for (const x of items) {
          const w = unit === "lb" ? x.weightLb : lbToKg(x.weightLb);
          const oneRm = estimate1RM(w, x.reps);
          if (!Number.isFinite(oneRm)) continue;
          const dayKey = isoToDateKey(x.createdAt);
          const prev = byDay.get(dayKey);
          if (!prev || oneRm > prev.oneRm) {
            byDay.set(dayKey, { dayKey, label: isoToDateLabel(x.createdAt), oneRm });
          }
        }
        const days = Array.from(byDay.values()).sort((a, b) => String(a.dayKey).localeCompare(String(b.dayKey)));
        const labels = days.map((d) => d.label);
        const data = days.map((d) => d.oneRm);

        const accent = getAccentColor();
        const rangeText =
          labels.length >= 2 ? `｜區間：${labels[0]}–${labels[labels.length - 1]}` : labels.length === 1 ? `｜日期：${labels[0]}` : "";
        chartMeta.textContent = `動作：${name}｜原始筆數：${items.length}｜彙整後：${labels.length} 天${rangeText}｜Y 軸：預估 1RM（${unit}）`;

        const ctx = progressChartEl.getContext("2d");
        if (!ctx) return;

        if (progressChart) progressChart.destroy();
        const pointRadius = data.length > 60 ? 0 : 2;
        progressChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: `預估 1RM（${unit}）`,
                data,
                borderColor: accent,
                backgroundColor: "transparent",
                pointBackgroundColor: accent,
                pointBorderColor: accent,
                borderWidth: 2,
                tension: 0.25,
                pointRadius,
                pointHoverRadius: 4,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => `${formatNumber(ctx.parsed.y, 1)} ${unit}`,
                },
              },
            },
            scales: {
              x: {
                ticks: {
                  maxRotation: 0,
                  autoSkip: false,
                  maxTicksLimit: 8,
                  callback: function (value, index) {
                    const total = labels.length;
                    if (total <= 10) return labels[index];
                    const step = Math.ceil(total / 8);
                    return index % step === 0 ? labels[index] : "";
                  },
                },
                grid: { color: "rgba(255,255,255,0.06)" },
              },
              y: {
                beginAtZero: false,
                grid: { color: "rgba(255,255,255,0.06)" },
                ticks: {
                  callback: (v) => `${v} ${unit}`,
                },
              },
            },
          },
        });
      }

      function resetInputs(focusName = true) {
        form.reset();
        update1RM();
        if (focusName) exerciseNameEl.focus();
      }

      function parseNum(el) {
        const raw = String(el.value ?? "").trim();
        if (!raw) return NaN;
        const normalized = raw.replace(",", ".");
        const v = Number(normalized);
        return Number.isFinite(v) ? v : NaN;
      }

      function update1RM() {
        const w = parseNum(weightEl);
        const r = parseNum(repsEl);

        const valid = Number.isFinite(w) && w > 0 && Number.isFinite(r) && r >= 1;
        if (!valid) {
          rmValue.textContent = "—";
          return;
        }
        const oneRm = w * (1 + r / 30);
        rmValue.textContent = `${formatNumber(oneRm, 1)} ${unit}`;
      }

      function nudge(el, delta, { min = -Infinity, step = 1 } = {}) {
        const current = parseNum(el);
        const base = Number.isFinite(current) ? current : 0;
        let next = base + delta;
        if (Number.isFinite(min)) next = Math.max(min, next);
        if (Number.isFinite(step) && step > 0) next = Math.round(next / step) * step;
        el.value = String(next);
        update1RM();
        el.dispatchEvent(new Event("input", { bubbles: true }));
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const name = exerciseNameEl.value.trim();
        const weightInput = parseNum(weightEl);
        const reps = Number(repsEl.value);
        const sets = Number(setsEl.value);

        const valid =
          name.length > 0 &&
          Number.isFinite(weightInput) &&
          weightInput >= 0 &&
          Number.isFinite(reps) &&
          reps >= 1 &&
          Number.isInteger(reps) &&
          Number.isFinite(sets) &&
          sets >= 1 &&
          Number.isInteger(sets);

        if (!valid) return;

        const weightLb = unit === "lb" ? weightInput : kgToLb(weightInput);
        const weightLbRounded = Math.round(weightLb * 2) / 2;

        const historical = logs.filter((x) => x.name === name);
        let prevBest = -Infinity;
        for (const x of historical) {
          const v = estimate1RM(x.weightLb, x.reps);
          if (Number.isFinite(v)) prevBest = Math.max(prevBest, v);
        }
        const newRm = estimate1RM(weightLbRounded, reps);
        const isNewPr = Number.isFinite(newRm) && newRm > prevBest;

        const entry = {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "_" + Math.random().toString(16).slice(2),
          name,
          weightLb: weightLbRounded,
          reps,
          sets,
          createdAt: new Date().toISOString(),
        };

        logs.unshift(entry);
        save();
        render();
        updateChart(name);
        if (isNewPr) {
          showPrCelebration();
          spawnConfetti();
        }
        resetInputs(true);
      });

      tableWrap.addEventListener("click", (e) => {
        const exBtn = e.target instanceof HTMLElement ? e.target.closest("button[data-exercise]") : null;
        if (exBtn) {
          const name = exBtn.getAttribute("data-exercise");
          if (name) updateChart(name);
          return;
        }
        const btn = e.target instanceof HTMLElement ? e.target.closest("button[data-del]") : null;
        if (!btn) return;
        const id = btn.getAttribute("data-del");
        logs = logs.filter((x) => x.id !== id);
        save();
        render();
        if (selectedExercise) {
          const stillExists = logs.some((x) => x.name === selectedExercise);
          if (stillExists) updateChart(selectedExercise);
          else if (logs[0]) updateChart(logs[0].name);
        } else if (logs[0]) {
          updateChart(logs[0].name);
        }
      });

      clearAllBtn.addEventListener("click", () => {
        if (!logs.length) return;
        const ok = confirm("確定要清除全部紀錄嗎？");
        if (!ok) return;
        logs = [];
        save();
        render();
        selectedExercise = null;
        if (progressChart) {
          progressChart.destroy();
          progressChart = null;
        }
      });

      clearInputsBtn.addEventListener("click", () => {
        resetInputs(true);
      });

      weightEl.addEventListener("input", update1RM);
      repsEl.addEventListener("input", update1RM);

      weightMinusBtn.addEventListener("click", () => nudge(weightEl, -unitDelta(), { min: 0, step: unitStep() }));
      weightPlusBtn.addEventListener("click", () => nudge(weightEl, +unitDelta(), { min: 0, step: unitStep() }));
      weightUnitBtn.addEventListener("click", () => {
        setUnit(unit === "lb" ? "kg" : "lb", { convertInput: true });
      });
      repsMinusBtn.addEventListener("click", () => nudge(repsEl, -1, { min: 1, step: 1 }));
      repsPlusBtn.addEventListener("click", () => nudge(repsEl, +1, { min: 1, step: 1 }));
      setsMinusBtn.addEventListener("click", () => nudge(setsEl, -1, { min: 1, step: 1 }));
      setsPlusBtn.addEventListener("click", () => nudge(setsEl, +1, { min: 1, step: 1 }));

      if (logSearchInput) {
        logSearchInput.addEventListener("input", () => {
          logSearchQuery = logSearchInput.value;
          render();
        });
      }

      function isCompactFormBreakpoint() {
        return window.matchMedia("(max-width: 720px)").matches;
      }

      exerciseNameEl.addEventListener("focus", () => {
        if (!isCompactFormBreakpoint()) return;
        requestAnimationFrame(() => {
          exerciseNameEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
          const card = exerciseNameEl.closest(".card");
          if (card instanceof HTMLElement)
            card.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
      });

      function initPwaHint() {
        if (!pwaHint || !pwaHintClose) return;
        // 只在手機顯示（小螢幕 + 觸控/粗指標）
        const isMobileLike =
          window.matchMedia("(max-width: 720px)").matches &&
          (window.matchMedia("(pointer: coarse)").matches || window.matchMedia("(hover: none)").matches);
        if (!isMobileLike) return;
        try {
          if (localStorage.getItem(PWA_HINT_KEY) === "1") return;
        } catch {
          /* ignore */
        }
        if (window.matchMedia("(display-mode: standalone)").matches) return;
        if (typeof window.navigator !== "undefined" && window.navigator.standalone === true) return;
        pwaHint.hidden = false;
        pwaHintClose.addEventListener("click", () => {
          pwaHint.hidden = true;
          try {
            localStorage.setItem(PWA_HINT_KEY, "1");
          } catch {
            /* ignore */
          }
        });
      }

      loadUnitPreference();
      load();
      render();
      update1RM();
      initPwaHint();
      if (logs[0]) updateChart(logs[0].name);
      exerciseNameEl.focus();
    </script>
  </body>
</html>
